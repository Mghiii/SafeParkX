<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <title>SafeParkX</title>
    {% block head %} {% endblock %}
  </head>

  <body>
    <div id="particles-js"></div>
    <nav>
      <h1><span>S</span>afe<span>P</span>ark<span>X</span></h1>
      <div>
        <h1 class="deweb">deweb</h1>
        <h3 class="technology">TECHNOLOGY</h3>
      </div>
    </nav>
    {% block content %} {% endblock %}
    <footer>
      <div class="content-footer">
        <div>
          <div class="fst">
            <h1 class="footer-title">
              <span>S</span>afe<span>P</span>ark<span>X</span>
            </h1>
            <div>
              <p>Confidentiality</p>
              <p>Security</p>
              <p>Privacy</p>
              <p>Trust</p>
            </div>
          </div>
          <div class="snd">
            <div class="sdiv">
              <h1 class="footer-deweb">deweb</h1>
              <h3 class="footer-technology">TECHNOLOGY</h3>
            </div>
            <div>
              <img
                src="/static/images/icons8-facebook-nouveau-48.png"
                alt="facebook"
              />
              <img src="/static/images/icons8-x-48.png" alt="twitter" />
              <img
                src="/static/images/icons8-instagram-48.png"
                alt="instagram"
              />
              <img src="/static/images/icons8-github-48.png" alt="linkedin" />
              <img
                src="/static/images/icons8-gmail-nouveau-48.png"
                alt="linkedin"
              />
            </div>
          </div>
        </div>
        <hr />
        <p class="copy">&copy; 2025 SafeParkX. All rights reserved.</p>
      </div>
    </footer>
    <script>
      particlesJS("particles-js", {
        particles: {
          number: { value: 80 },
          color: { value: "#fff" },
          shape: { type: "circle" },
          opacity: { value: 0.3 },
          size: { value: 3 },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#fff",
            opacity: 0.2,
            width: 1,
          },
          move: { enable: true, speed: 1 },
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: {
              enable: true,
              mode: "grab",
            },
          },
        },
        retina_detect: true,
      });
    </script>
  </body>
</html>
